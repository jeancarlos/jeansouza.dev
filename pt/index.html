" renderer-url="/_astro/client.BEBuIjiH.js" props="{&quot;locale&quot;:[0,&quot;pt&quot;],&quot;posts&quot;:[1,[[0,{&quot;slug&quot;:[0,&quot;2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi&quot;],&quot;title&quot;:[0,&quot;Por que eu construí esse site do jeito que construí&quot;],&quot;date&quot;:[0,&quot;2026-06-03&quot;],&quot;description&quot;:[0,&quot;Esse portfólio não é uma lista de tecnologias. É uma série de decisões deliberadas — e o código aberto pra quem quiser auditar.&quot;],&quot;cover&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_Z2jM8Hy.webp&quot;],&quot;srcSet&quot;:[0,&quot;/_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_Z2jM8Hy.webp 820w, /_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_ZWFvt4.webp 1640w&quot;],&quot;alt&quot;:[0,&quot;Ilustração no estilo do tarô Rider-Waite: o Louco, com uma trouxa no ombro e uma rosa na mão, caminha olhando o sol na beira de um penhasco, com um cão branco aos pés, montanhas nevadas ao fundo e um rio no vale.&quot;]}],&quot;thumb&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_1t2NKg.webp&quot;],&quot;srcSet&quot;:[0,&quot;/_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_1t2NKg.webp 176w, /_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_Z1lKWCJ.webp 352w, /_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_zVp1R.webp 704w&quot;]}],&quot;ogImage&quot;:[0,&quot;/_astro/2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi.CJf7MHcJ_ZlLWfh.jpg&quot;],&quot;content&quot;:[0,&quot;Eu precisava de um lugar pra guardar minhas ideias, mostrar o que sei fazer e ter algo concreto que represente o que diz no meu currículo. Um portfólio que não seja só lista de tecnologias, mas que prove que o que tá escrito ali é real. Porque hoje qualquer um consegue gerar código com IA. A diferença tá no julgamento, no gosto, na visão do que faz sentido e do que não faz. E isso não dá pra fingir: só alguém que realmente entende consegue construir algo que mostre isso. Esse blog é o jeito mais honesto que encontrei de fechar esse gap.\n\nE não é o primeiro. Eu gosto do visual antigo, mas não da forma como ele foi feito. Um dia brinquei com HTML e CSS no gh-pages, subi, e nunca mais revisei o conteúdo. Depois voltei pra estruturar o blog com CI/CD e SSG do Next.js, mas também não terminei. Nunca refinei, nunca escrevi mais posts. Dessa vez a dificuldade técnica é o ponto, não um acidente: uma interface fora do comum na web, bem implementada. É ali que espero construir uma base onde outros devs possam ler e aprender junto comigo, porque cada post é um estudo de um problema real, e o código fica aberto no GitHub pra quem quiser auditar as decisões, não só ler sobre elas.\n\nMas pensar em todos os pormenores é impossível. Você só descobre o que precisa de ajuste usando de verdade, e a interface ainda precisa funcionar no mundo real e atender às minhas expectativas sobre como os usuários vão navegar nela. Daí vêm as decisões sobre o que pular, manter ou melhorar. Nem tudo que eu planejei vai ser feito: se não encaixa na visão, não agrega tanto, ou adiciona complexidade desnecessária, fica de fora. E outras coisas vão entrando com o tempo. Uma delas é uma lista de projetos, com um \&quot;case\&quot; de cada um que achar interessante comentar, provavelmente junto do blog, em vez de uma página separada de projetos.&quot;]}]]],&quot;pathname&quot;:[0,&quot;/pt/&quot;]}" ssr client="afterpaint" opts="{&quot;name&quot;:&quot;DesktopApp&quot;,&quot;value&quot;:true}" await-children><span aria-hidden="true" class="pointer-events-none fixed top-1/2 left-1/2 z-[5] hidden -translate-x-1/2 -translate-y-1/2 text-[12px] select-none md:block" style="opacity:0">👁️👄👁️</span><div class="[--home-h:360px] md:[--home
