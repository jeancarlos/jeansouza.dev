não seja só lista de tecnologias, mas que prove que o que tá escrito ali é real. Porque hoje qualquer um consegue gerar código com IA. A diferença tá no julgamento, no gosto, na visão do que faz sentido e do que não faz. E isso não dá pra fingir: só alguém que realmente entende consegue construir algo que mostre isso. Esse blog é o jeito mais honesto que encontrei de fechar esse gap.\n\nE não é o primeiro. Eu gosto do visual antigo, mas não da forma como ele foi feito. Um dia brinquei com HTML e CSS no gh-pages, subi, e nunca mais revisei o conteúdo. Depois voltei pra estruturar o blog com CI/CD e SSG do Next.js, mas também não terminei. Nunca refinei, nunca escrevi mais posts. Dessa vez a dificuldade técnica é o ponto, não um acidente: uma interface fora do comum na web, bem implementada. É ali que espero construir uma base onde outros devs possam ler e aprender junto comigo, porque cada post é um estudo de um problema real, e o código fica aberto no GitHub pra quem quiser auditar as decisões, não só ler sobre elas.\n\nMas pensar em todos os pormenores é impossível. Você só descobre o que precisa de ajuste usando de verdade, e a interface ainda precisa funcionar no mundo real e atender às minhas expectativas sobre como os usuários vão navegar nela. Daí vêm as decisões sobre o que pular, manter ou melhorar. Nem tudo que eu planejei vai ser feito: se não encaixa na visão, não agrega tanto, ou adiciona complexidade desnecessária, fica de fora. E outras coisas vão entrando com o tempo. Uma delas é uma lista de projetos, com um \&quot;case\&quot; de cada um que achar interessante comentar, provavelmente junto do blog, em vez de uma página separada de projetos.\n&quot;]}]]],&quot;initialOpen&quot;:[0],&quot;initialPost&quot;:[0,{&quot;slug&quot;:[0,&quot;2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi&quot;],&quot;locale&quot;:[0,&quot;pt&quot;],&quot;title&quot;:[0,&quot;Por que eu construí esse site do jeito que construí&quot;],&quot;date&quot;:[0,&quot;
