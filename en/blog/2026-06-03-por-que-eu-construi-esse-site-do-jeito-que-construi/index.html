le&quot;:[0,&quot;en&quot;],&quot;title&quot;:[0,&quot;Why I built this site the way I built it&quot;],&quot;date&quot;:[0,&quot;2026-06-03&quot;],&quot;description&quot;:[0,&quot;This portfolio isn&#39;t a list of technologies. It&#39;s a series of deliberate decisions — and the code is open for anyone who wants to audit it.&quot;],&quot;content&quot;:[0,&quot;\nI needed somewhere to keep my ideas, show what I can do, and have something concrete that backs up what&#39;s on my resume. A portfolio that isn&#39;t just a list of technologies, but actually proves that what&#39;s written there is real. Because today anyone can generate code with AI. The difference is in judgment, taste, the sense of what makes sense and what doesn&#39;t. And that&#39;s not something you can fake: only someone who genuinely understands can build something that shows it. This blog is the most honest way I found to bridge that gap.\n\nAnd this isn&#39;t the first one. I like the old-school aesthetic, but not how it was built. At some point I threw together some HTML and CSS on gh-pages, pushed it, and never touched the content again. Then I came back and structured a blog with CI/CD and Next.js SSG, but didn&#39;t finish that either. Never refined it, never wrote more posts. This time the technical difficulty is the point, not an accident: an interface that&#39;s genuinely unusual on the web, well implemented. That&#39;s where I&#39;m hoping to build something other developers can read and learn from, because each post is a study of a real problem, and the code is open on GitHub for anyone who wants to audit the decisions, not just read about them.\n\nBut thinking through every detail upfront is impossible. You only find out what needs adjusting by actually using it, and the interface still has to work in the real world and meet my expectations for how users are going to navigate it. That&#39;s where decisions come from about what to skip, keep, or improve. Not everything I planned will get built: if it doesn&#39;t fit the vision, doesn&#39;t add much, or adds unnecessary complexity, it&#39;s out. Other things come in over time. One of them is a projects list, with a writeup for each one I find worth talking about — probably alongside the blog rather than a separate projects page.\n&quot;]}]]],&quot;initialOpen&quot;:[0],&quot;initialPost&quot;:[0,{&quot;slug&quot;:[0,&quot;2026-06-03-por-que-eu-construi-esse-site-do-jeito-que-construi&quot;],&quot;locale&quot;:[0,&quot;en&quot;],&quot;title&quot;:[0,&quot;Why I built this site the way I built it&quot;],&quot;date&quot;:[0,&quot;2026-06-03&quot;],&quot;description&quot;:[0,&quot;This portfolio isn&#39;t a list of technologies. It&#39;s a series of deliberate decisions — and the code is open for anyone who wants to audit it.&quot;],&quot;content&quot;:[0,&quot;\nI needed somewhere to keep my ideas, show what I can do, and have something concrete that backs up what&#39;s on my resume. A portfolio that isn&#39;t just a list of technologies, but actually proves that what&#39;s written there is real. Because today anyone can generate code with AI. The difference is in judgment, taste, the sense of what makes sense and what doesn&#39;t. And that&#39;s not something you can fake: only someone who genuinely understands can build something that shows it. This blog is the most honest way I found to bridge that gap.\n\nAnd this isn&#39;t the first one. I like the old-school aesthetic, but not how it was built. At some point I threw together some HTML and CSS on gh-pages, pushed it, and never touched the content again. Then I came back and structured a blog with CI/CD and Next.js SSG, but didn&#39;t finish that either. Never refined it, never wrote more posts. This time the technical difficulty is the point, not an accident: an interface that&#39;s genuinely unusual on the web, well implemented. That&#39;s where I&#39;m hoping to build something other developers can read and learn from, because each post is a study of a real problem, and the code is open on GitHub for anyone who wants to audit the decisions, not just read about them.\n\nBut thinking through every detail upfront is impossible. You only find out what needs adjusting by actually using it, and the interface still has to work in the real world and meet my expectations for how users are going to navigate it. That&#39;s where decisions come from about what to skip, keep, or improve. Not everything I planned will get built: if it doesn&#39;t fit the vision, doesn&#39;t add much, or adds unnecessary complexity, it&#39;s out. Other things come in over time. One of them is a projects list, with a writeup for each one I find worth talking about — probably alongside the blog rather than a separate projects page.\n&quot;]}]}" ssr client="load" opts="{&quot;name&quot;:&quot;DesktopApp&quot;,&quot;value&quot;:true}" await-children><span aria-hidden="true" class="pointer-events-none fixed top-1/2 left-1/2 z-[5] hidden -translate-x-1/2 -translate-y-1/2 text-[12px] select-none md:block" style="opacity:0">👁️👄👁️</span><div class="rounded-2xl bg-gradient-to-r from-brand-from to-brand-to p-[2px] shadow-2xl flex" role="dialog" aria-modal="true" aria-label="~ jeansouza.dev" style="width:600px;height:256px;z-index:10;position:fixed;opacity:0;transform:translateX(300px) translateY(309.5px) scale(0.75)"><div class="flex min-h-0 w-full flex-col overflow-hidden rounded-[14px]"><div class="hidden shrink-0 items-center gap-2 px-3 py-2.5 select-none bg-gradient-to-r from-brand-from to-brand-to md:flex cursor-grab active:cursor-grabbing"><button data-traffic-dot="true" aria-label="Close" disabled="" class="group relative inline-flex h-3.5 w-3.5 items-center justify-center rounded-full ring-1 ring-white/40 transition-all duration-150 hover:scale-110 active:scale-95 pointer-events-none opacity-40" style="background-color:var(--color-traffic-close)"><span aria-hidden="true" class="pointer-events-none text-[10px] leading-none font-bold text-whi
