<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d">
<title id="t">The score missed the fix</title><desc id="d">Mean Lighthouse accessibility score on mobile: 96.7 before and 97.1 after. axe landmark and unreachable-scroll violations: 30 before and 0 after.</desc>
<rect width="720" height="340" rx="12" fill="#1e1e2e"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#cdd6f4" text-anchor="start">The score missed the fix</text><circle cx="24" cy="60" r="5" fill="#d95926"/><text x="34" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="start">Next 16 (before)</text><circle cx="154" cy="60" r="5" fill="#3987e5"/><text x="164" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="start">Astro 7 (after)</text><text x="24" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" text-anchor="start">Lighthouse: accessibility score</text><text x="24" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9399b2" text-anchor="start">mean of 11 pages, mobile, 0-100 scale</text><line x1="24" y1="290" x2="314" y2="290" stroke="#45475a" stroke-width="1"/><path d="M64,290.0 V145.04 Q64,141.04 68,141.04 H140 Q144,141.04 144,145.04 V290.0 Z" fill="#d95926"/><text x="104" y="133.04" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cdd6f4" text-anchor="middle">96.7</text><text x="104" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="middle">before</text><path d="M184,290.0 V144.48 Q184,140.48 188,140.48 H260 Q264,140.48 264,144.48 V290.0 Z" fill="#3987e5"/><text x="224" y="132.48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cdd6f4" text-anchor="middle">97.1</text><text x="224" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="middle">after</text><text x="390" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" text-anchor="start">axe: landmark and scroll violations</text><text x="390" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9399b2" text-anchor="start">all pages, desktop and mobile</text><line x1="390" y1="290" x2="680" y2="290" stroke="#45475a" stroke-width="1"/><path d="M430,290.0 V140.0 Q430,136.0 434,136.0 H506 Q510,136.0 510,140.0 V290.0 Z" fill="#d95926"/><text x="470" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cdd6f4" text-anchor="middle">30</text><text x="470" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="middle">before</text><text x="590" y="282.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cdd6f4" text-anchor="middle">0</text><text x="590" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#bac2de" text-anchor="middle">after</text>
